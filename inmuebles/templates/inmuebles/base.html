<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OP Agente Inmobiliario{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark" style="background:#1F3B57">
  <div class="container">
    <a class="navbar-brand" href="{% url 'inmueble_list' %}">OP Agente Inmobiliario</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'inmueble_list' %}">Inmuebles</a>
      <a class="nav-link" href="{% url 'propietario_list' %}">Propietarios</a>
      <a class="nav-link" href="/admin/">Administración</a>
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
      {% csrf_token %}
      <span class="navbar-text small">{{ user.get_username }}</span>
      <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
    </form>
    {% endif %}
  </div>
</nav>

<main class="container py-4">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
