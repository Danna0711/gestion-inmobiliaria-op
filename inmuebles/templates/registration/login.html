{% extends "inmuebles/base.html" %}
{% block title %}Ingresar · OP Agente Inmobiliario{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Ingresar al sistema</h1>
        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input class="form-control" type="text" name="username" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
